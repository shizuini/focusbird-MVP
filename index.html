<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Bird MVP</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Focus Bird</h1>
    <p class="subtitle">让专注成为一次陪伴式成长旅程</p>


    <div class="bird-card">
        <div class="bird">🐦</div>
        <p>小鸟正在等待你的下一次旅行</p>
    </div>


    <div class="task-card">

        <h2>创建专注任务</h2>

        <input 
        class="task-input"
        placeholder="请输入你的任务，例如：完成营销科技创新报告">


        <h3>选择专注时间</h3>

        <div class="time-box">
            <span>当前选择：</span>
            <strong id="timeShow">40分钟</strong>
        </div>


        <div class="time-slider">

            <input 
            type="range"
            min="1"
            max="60"
            value="40"
            id="timeRange">

        </div>


        <button onclick="startFocus()">
            开始专注
        </button>


    </div>


</div>


<script src="script.js"></script>

</body>
</html>
